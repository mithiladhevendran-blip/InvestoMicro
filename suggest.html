<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Suggestions</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* [Existing CSS Styles remain the same for consistency] */
        :root {
            --bg-main: rgb(67, 48, 40);
            --bg-card: rgb(84, 66, 55);
            --border-color: rgb(110, 90, 76);
            --text-main: rgb(255, 0, 255);
            --text-muted: rgb(209, 188, 173);
            --accent-blue: rgb(84, 155, 255);
            --accent-emerald: rgb(41, 210, 154);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: var(--bg-card); padding: 2rem; border-radius: 20px; width: 480px; border: 1px solid var(--border-color); }
        
        /* Chatbot Styles */
        #chat-history { height: 250px; overflow-y: auto; margin: 15px 0; padding: 10px; background: var(--bg-main); border-radius: 10px; font-size: 0.9rem; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 8px; }
        .msg.user { background: var(--accent-blue); color: white; text-align: right; }
        .msg.ai { background: var(--border-color); color: white; }
        #chat-input-area { display: flex; gap: 5px; }
        input#chat-input { flex: 1; padding: 10px; border-radius: 8px; border: none; background: var(--bg-main); color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>🤖 Agentic Investment Advisor</h2>
    
    <div id="chat-history">
        <div class="msg ai">Hello! I've analyzed your current spending patterns. Ask me anything about your financial goals!</div>
    </div>

    <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask about your investment strategy...">
        <button onclick="handleChat()">Send</button>
    </div>
</div>

<script>
    const S_URL = 'YOUR_SUPABASE_URL';
    const S_KEY = 'YOUR_SUPABASE_KEY';
    const _supabase = supabase.createClient(S_URL, S_KEY);
    
    let currentSpendingData = null;

    // Fetch data on load
    async function loadData() {
        // ... (Keep your existing data fetching logic here)
        // Ensure currentSpendingData is populated
    }

    async function handleChat() {
        const input = document.getElementById('chat-input');
        const history = document.getElementById('chat-history');
        const userText = input.value.trim();
        
        if (!userText) return;

        // 1. Add User Message
        history.innerHTML += `<div class="msg user">${userText}</div>`;
        input.value = '';

        // 2. Logic "Brain" (Agentic reasoning based on your data)
        // You can expand this with more complex conditions
        setTimeout(() => {
            let reply = "I'm processing that based on your ledger...";
            if (userText.toLowerCase().includes('invest')) {
                reply = `Based on your current ratio of ${currentSpendingData.ratio}%, I recommend investing ₹${currentSpendingData.investmentTarget}/day to stay safe.`;
            } else {
                reply = "I'm designed to help you optimize your spending. Try asking 'How much should I invest?'";
            }
            
            history.innerHTML += `<div class="msg ai">${reply}</div>`;
            history.scrollTop = history.scrollHeight;
        }, 800);
    }

    window.onload = loadData;
</script>

</body>
</html>
