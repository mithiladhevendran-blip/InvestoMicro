<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter API Bridge - InvestoMicro</title>
</head>
<body>
    <script>
        const OPENROUTER_BRIDGE = {
            apiEndpoint: "https://api.openrouter.io/api/v1/chat/completions",
            
            async analyzeInvestmentPattern(spendingData) {
                try {
                    const systemPrompt = `You are an expert financial advisor AI agent for micro-investing.
Your role is to:
1. ANALYZE the user's spending patterns
2. REASON through their financial situation step-by-step
3. GENERATE actionable investment recommendations
4. EXPLAIN your reasoning clearly`;

                    const userPrompt = `Analyze this spending data: ${JSON.stringify(spendingData, null, 2)}`;

                    return {
                        systemPrompt,
                        userPrompt,
                        model: "claude-3.5-sonnet"
                    };
                } catch (error) {
                    console.error("Analysis error:", error);
                    return null;
                }
            }
        };

        window.OPENROUTER_BRIDGE = OPENROUTER_BRIDGE;
    </script>
</body>
</html>
