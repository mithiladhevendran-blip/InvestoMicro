<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Suggestions - MicroInvest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: rgb(67, 48, 40);
            --bg-card: rgb(84, 66, 55);
            --border-color: rgb(110, 90, 76);
            --text-main: rgb(255, 255, 255); /* Fixed from 255, 0, 255 */
            --text-muted: rgb(209, 188, 173);
            --accent-blue: rgb(84, 155, 255);
            --accent-emerald: rgb(41, 210, 154);
            --accent-purple: rgb(164, 117, 255);
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding-bottom: 120px; display: flex; flex-direction: column; align-items: center; }

        .box { background: var(--bg-card); padding: 2.2rem; border-radius: 20px; width: 480px; border: 1px solid var(--border-color); margin-top: 20px; }

        /* AI Advisor Panel Styling */
        .ai-advisor-panel {
            background: rgba(30, 41, 59, 0.5);
            border: 2px solid var(--accent-blue);
            border-radius: 14px;
            padding: 20px;
            margin-top: 16px;
            display: none;
            text-align: left;
        }
        .ai-advisor-panel.active { display: block; }
        .ai-advisor-label { color: var(--accent-blue); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
        .ai-advisor-value { color: var(--text-main); margin-top: 4px; font-size: 0.9rem; }
        
        .btn-ai-advisor {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>💡 Micro Investment Triggers</h2>
        
        <div class="metric-card">
            <div class="metric-title" style="color:var(--text-muted)">💰 End-Of-Day Safe Investment</div>
            <div class="metric-body" id="safe-investment-display" style="color:var(--accent-emerald)">₹0.00</div>
        </div>

        <button class="btn-ai-advisor" id="btn-ai-advisor" onclick="activateAIAdvisor()">
            🤖 Get AI Investment Advisor
        </button>

        <div class="ai-advisor-panel" id="ai-advisor-panel">
            <div class="ai-advisor-title" style="color:var(--accent-blue); font-weight:700;">AI Advisor Analysis</div>
            <div class="ai-advisor-content" id="advisor-content" style="margin-top:10px;">
                Analyzing your financial patterns...
            </div>
        </div>
    </div>

    <script>
        let currentSpendingData = null;

        async function activateAIAdvisor() {
            const panel = document.getElementById('ai-advisor-panel');
            const content = document.getElementById('advisor-content');
            
            panel.classList.add('active');
            content.innerHTML = "Processing financial records...";

            setTimeout(() => {
                // Example logic to demonstrate color consistency
                content.innerHTML = `
                    <div class="ai-advisor-section">
                        <div class="ai-advisor-label">📊 Analysis</div>
                        <div class="ai-advisor-value">Your current spending ratio is optimized.</div>
                    </div>
                    <div class="ai-advisor-section" style="margin-top:15px;">
                        <div class="ai-advisor-label">💡 Recommendation</div>
                        <div class="ai-advisor-value" style="color: var(--accent-emerald);">Increase daily savings by ₹20.</div>
                    </div>
                `;
            }, 1000);
        }
    </script>
</body>
</html>
