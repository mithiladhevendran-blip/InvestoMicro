<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Intent Classifier - InvestoMicro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-emerald: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-main);
            margin: 0;
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 120px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 480px;
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        .brand {
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 1.1rem;
        }

        .profile-badge {
            background: var(--accent-blue);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .box {
            background: var(--bg-card);
            padding: 2.2rem;
            border-radius: 20px;
            width: 480px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: var(--text-muted);
        }

        .sub-header {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 24px;
        }

        .field-label {
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .classification-box {
            background: rgba(59, 130, 246, 0.1);
            border: 2px dashed var(--accent-blue);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .ai-reasoning-box {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--accent-purple);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.8rem;
            margin-bottom: 16px;
            text-align: left;
            line-height: 1.5;
            display: none;
        }

        .ai-reasoning-box.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .note-input {
            width: 100%;
            padding: 14px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: inherit;
            resize: none;
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            background: var(--accent-emerald);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .btn-confirm:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-secondary {
            flex: 1;
            padding: 12px;
            background: #334155;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .error-msg {
            color: var(--accent-red);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .nav-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            display: flex;
            padding: 8px;
            width: 440px;
            border-radius: 16px;
        }

        .nav-dock button {
            flex: 1;
            margin: 0 4px;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-dock .active {
            background: var(--accent-blue);
            color: white !important;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-top: 2px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>

<body>

    <div class="top-bar">
        <div class="brand">InvestoMicro</div>

        <button
            class="profile-badge"
            onclick="location.href='profile.html'"
        >
            👤 Profile
        </button>
    </div>

    <div class="box">

        <h2>AI Intent Classification</h2>

        <div
            class="sub-header"
            id="engine-status"
        >
            Thinking...
        </div>

        <span class="field-label">
            AI Classification Label
        </span>

        <div
            class="classification-box"
            id="ai-label-display"
        >
            🤖 Querying Neural Network...
        </div>

        <!-- NEW: Agentic Reasoning Display -->
        <div
            class="ai-reasoning-box"
            id="ai-reasoning-display"
        >
            <strong style="color: var(--accent-purple);">AI Reasoning:</strong>
            <div id="reasoning-text" style="margin-top: 8px;"></div>
        </div>

        <span class="field-label">
            Passed Item Description
        </span>

        <textarea
            id="ai-desc-display"
            class="note-input"
            rows="2"
            readonly
        ></textarea>

        <button
            class="btn-confirm"
            id="btn-submit-ledger"
            onclick="commitRowToSupabase()"
            disabled
        >
            Confirm & Write to Database
        </button>

        <div
            class="error-msg"
            id="db-error"
        ></div>

        <div class="btn-row">

            <button
                class="btn-secondary"
                onclick="location.href='input.html'"
            >
                ← Entry Input
            </button>

            <button
                class="btn-secondary"
                onclick="location.href='patterns.html'"
            >
                📄 View Patterns
            </button>

        </div>

    </div>

    <div class="nav-dock">

        <button onclick="location.href='input.html'">
            Input
        </button>

        <button
            class="active"
            onclick="location.href='ai.html'"
        >
            AI Analysis
        </button>

        <button onclick="location.href='patterns.html'">
            Patterns
        </button>

        <button onclick="location.href='suggest.html'">
            Suggestions
        </button>

    </div>

    <script>

        const S_URL =
            'https://funcvigewkhauenqxrbf.supabase.co';

        const S_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bmN2aWdld2toYXVlbnF4cmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NTM1MzQsImV4cCI6MjA5NDEyOTUzNH0.INR7nkrv-CV80i97SyaHwdZd3chlQjaVgNsQY39Nqxo';

        const _supabase =
            supabase.createClient(
                S_URL,
                S_KEY
            );

        let localAmount =
            localStorage.getItem('pending_amt') || 0;

        let localDesc =
            localStorage.getItem('pending_desc') || "";

        const targetCategories = [

            "Necessary / Long-term",

            "Unnecessary / Long-term",

            "Necessary / Short-term",

            "Short Term / Unnecessary"
        ];

        /**
         * AGENTIC AI CLASSIFICATION
         * Uses reasoning to classify spending with explanation
         */
        async function runAgenticClassifier(text, amount) {

            if (!text || text.trim() === "") {
                return {
                    category: "Short Term / Unnecessary",
                    reasoning: "No description provided. Defaulting to conservative classification."
                };
            }

            try {
                // Simulate agentic reasoning - in production this would call OpenRouter
                const reasoning = generateClassificationReasoning(text, amount);
                return reasoning;

            } catch (err) {

                console.error("Classifier failed:", err);
            }

            return localClassifierFallback(text);
        }

        /**
         * Generate reasoning for classification
         * This mimics how an AI would think through the categorization
         */
        function generateClassificationReasoning(description, amount) {
            const lowerDesc = description.toLowerCase();
            const amountNum = parseFloat(amount) || 0;
            
            // Agentic reasoning chain
            let category, reasoning;

            // Long-term indicators
            const longTermKeywords = ['course', 'tuition', 'laptop', 'education', 'boots', 'shoe', 'gym', 'insurance', 'repair', 'medical', 'health', 'investment'];
            const necessaryLongTerm = ['education', 'work equipment', 'medical', 'insurance', 'rent', 'health', 'laptop', 'boot', 'course'];
            const unnecessaryLongTerm = ['crypto', 'stock', 'gold', 'luxury', 'collection', 'antique'];

            // Short-term indicators
            const necessaryShortTerm = ['doctor', 'vet', 'medicine', 'med', 'food', 'fuel', 'bus', 'taxi', 'groceries', 'transport', 'utility'];
            const unnecessaryShortTerm = ['snack', 'junk', 'gaming', 'cosmetic', 'impulse', 'subscription'];

            // Multi-step reasoning
            if (necessaryLongTerm.some(kw => lowerDesc.includes(kw))) {
                category = "Necessary / Long-term";
                reasoning = `AI reasoning: "${description}" matches long-term necessity criteria. This is an investment in your future (education/health/work). Amount ₹${amountNum} is justified for quality.`;
            } else if (necessaryShortTerm.some(kw => lowerDesc.includes(kw))) {
                category = "Necessary / Short-term";
                reasoning = `AI reasoning: "${description}" is a short-term essential. This is required for daily living (food/transport/medical). Amount ₹${amountNum} is reasonable.`;
            } else if (unnecessaryLongTerm.some(kw => lowerDesc.includes(kw))) {
                category = "Unnecessary / Long-term";
                reasoning = `AI reasoning: "${description}" appears to be speculative or luxury spending with long-term implications. Consider if this aligns with your investment goals.`;
            } else if (amountNum > 500) {
                category = "Unnecessary / Long-term";
                reasoning = `AI reasoning: High-value item (₹${amountNum}) with unclear necessity classification. Treating as potentially speculative until verified as essential.`;
            } else if (unnecessaryShortTerm.some(kw => lowerDesc.includes(kw))) {
                category = "Short Term / Unnecessary";
                reasoning = `AI reasoning: "${description}" matches impulse/leisure spending patterns. This is discretionary spending, not essential.`;
            } else {
                category = "Short Term / Unnecessary";
                reasoning = `AI reasoning: "${description}" couldn't be matched to essential categories. Classified as discretionary spending. Amount: ₹${amountNum}.`;
            }

            return { category, reasoning };
        }

        function localClassifierFallback(text) {

            const parsed =
                text.toLowerCase();

            // Necessary Long-Term
            if (

                parsed.includes('course') ||
                parsed.includes('tuition') ||
                parsed.includes('laptop') ||
                parsed.includes('boots') ||
                parsed.includes('shoe') ||
                parsed.includes('gym') ||
                parsed.includes('insurance') ||
                parsed.includes('repair') ||
                parsed.includes('education')

            ) {

                return { category: "Necessary / Long-term", reasoning: "Matched to long-term necessity keywords." };
            }

            // Necessary Short-Term
            if (

                parsed.includes('doctor') ||
                parsed.includes('vet') ||
                parsed.includes('medicine') ||
                parsed.includes('med') ||
                parsed.includes('food') ||
                parsed.includes('fuel') ||
                parsed.includes('bus') ||
                parsed.includes('taxi') ||
                parsed.includes('groceries')

            ) {

                return { category: "Necessary / Short-term", reasoning: "Matched to short-term necessity keywords." };
            }

            // Unnecessary Long-Term
            if (

                parsed.includes('crypto') ||
                parsed.includes('stock') ||
                parsed.includes('gold') ||
                parsed.includes('luxury')

            ) {

                return { category: "Unnecessary / Long-term", reasoning: "Matched to speculative/luxury keywords." };
            }

            return { category: "Short Term / Unnecessary", reasoning: "Default classification for unmatched items." };
        }

        window.onload = async function () {

            document.getElementById(
                'ai-desc-display'
            ).value = localDesc;

            const result =
                await runAgenticClassifier(
                    localDesc,
                    localAmount
                );

            const category = result.category || "Short Term / Unnecessary";
            const reasoning = result.reasoning || "Classification complete.";

            document.getElementById(
                'ai-label-display'
            ).innerText =
                `🤖 ${category}`;

            // Display reasoning
            document.getElementById('reasoning-text').innerText = reasoning;
            document.getElementById('ai-reasoning-display').classList.add('active');

            document.getElementById(
                'engine-status'
            ).innerText =
                "Analysis Ready";

            document.getElementById(
                'btn-submit-ledger'
            ).disabled = false;
        };

        async function commitRowToSupabase() {

            const errBox =
                document.getElementById(
                    'db-error'
                );

            errBox.style.display = "none";

            const sessionData =
                await _supabase.auth.getSession();

            if (
                !sessionData.data ||
                !sessionData.data.session
            ) {

                errBox.innerText =
                    "Session expired. Please log back in.";

                errBox.style.display = "block";

                return;
            }

            const activeUser =
                sessionData.data.session.user;

            const computedCategory =
                document.getElementById(
                    'ai-label-display'
                )
                .innerText
                .replace('🤖 ', '');

            const { error } =
                await _supabase
                    .from('spends')
                    .insert([
                        {
                            amount:
                                parseFloat(localAmount),

                            description:
                                localDesc,

                            category:
                                computedCategory,

                            user_id:
                                activeUser.id
                        }
                    ]);

            if (error) {

                errBox.innerText =
                    `Database Error: ${error.message}`;

                errBox.style.display =
                    "block";

            } else {

                localStorage.removeItem(
                    'pending_amt'
                );

                localStorage.removeItem(
                    'pending_desc'
                );

                window.location.href =
                    'patterns.html';
            }
        }

    </script>

</body>
</html>
