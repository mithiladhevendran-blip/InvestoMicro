<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Financial Chat</title>
    <style>
        body { background: rgb(67, 48, 40); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .chat-box { width: 100%; max-width: 500px; background: rgb(84, 66, 55); padding: 20px; border-radius: 20px; }
        #messages { height: 400px; overflow-y: auto; margin-bottom: 20px; border-bottom: 1px solid #475569; padding-right: 10px; }
        .msg { margin-bottom: 15px; padding: 10px; border-radius: 12px; font-size: 0.9rem; }
        .user { background: #3b82f6; text-align: right; margin-left: 20%; }
        .ai { background: #475569; margin-right: 20%; }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>InvestoMicro AI</h2>
    <div id="messages"></div>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="input" placeholder="Ask about your finances..." style="flex: 1; padding: 10px; border-radius: 8px; border: none;">
        <button onclick="sendMessage()" style="padding: 10px 20px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer;">Send</button>
    </div>
</div>

<script>
    // Get cached data instantly without waiting for network
    const userStats = JSON.parse(localStorage.getItem('userFinanceData')) || { ratio: 0, essential: 0 };

    function addMessage(sender, text) {
        const div = document.createElement('div');
        div.className = `msg ${sender.toLowerCase()}`;
        div.innerHTML = `<b>${sender}:</b> ${text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    // Initial greeting
    addMessage("AI", "Data loaded. I'm ready to analyze your spending. Ask me about your ratios or savings!");

    function sendMessage() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text) return;

        addMessage("User", text);
        input.value = '';

        // Immediate logic response (No setTimeout)
        let response = "I'm processing that. Try asking about 'ratio' or 'investment'.";
        const lowerText = text.toLowerCase();
        
        if (lowerText.includes('ratio')) {
            response = `Your current essential spending ratio is ${userStats.ratio}%.`;
        } else if (lowerText.includes('invest')) {
            response = `Based on your data, you could safely move ₹${Math.round(userStats.essential * 0.01)} into high-yield savings daily.`;
        }
        
        addMessage("AI", response);
    }
</script>
</body>
</html>
