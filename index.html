<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MicroInvest - Auth Suite</title>

    <script src="https://jsdelivr.net"></script>

    <style>

        body{
            font-family:'Inter',system-ui,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:rgb(67, 48, 40); /* --bg-main */
            margin:0;
            color:rgb(255, 0, 255); /* --text-main */
        }

        .box{
            background:rgb(84, 66, 55); /* --bg-card */
            padding:2.5rem;
            border-radius:24px;
            box-shadow:0 20px 50px rgba(0,0,0,0.4);
            width:380px;
            text-align:center;
            border:1px solid rgb(110, 90, 76); /* --border-color */
            box-sizing:border-box;
        }

        h2{
            margin-top:0;
            margin-bottom:0.5rem;
            color:rgb(84, 155, 255); /* --accent-blue */
            letter-spacing:-1px;
            font-size:1.8rem;
        }

        p{
            color:rgb(209, 188, 173); /* --text-muted */
            font-size:0.9rem;
            margin-bottom:2rem;
            margin-top:0;
        }

        .form-group{
            text-align:left;
            margin-bottom:14px;
        }

        label{
            display:block;
            font-size:0.75rem;
            color:rgb(209, 188, 173); /* --text-muted */
            text-transform:uppercase;
            font-weight:bold;
            margin-bottom:6px;
        }

        input[type="email"],
        input[type="password"]{
            width:100%;
            padding:14px;
            border:1px solid rgb(110, 90, 76); /* --border-color */
            border-radius:12px;
            box-sizing:border-box;
            background:rgb(67, 48, 40); /* --bg-main */
            color:rgb(255, 0, 255); /* --text-main */
            outline:none;
            font-size:0.95rem;
        }

        input:focus{
            border-color:rgb(84, 155, 255); /* --accent-blue */
        }

        .checkbox-group{
            display:none;
            align-items:center;
            text-align:left;
            margin:15px 0;
            background:rgb(67, 48, 40); /* --bg-main */
            padding:12px;
            border-radius:12px;
            border:1px solid rgb(110, 90, 76); /* --border-color */
        }

        .checkbox-group input{
            width:18px;
            height:18px;
            margin-right:12px;
            cursor:pointer;
        }

        .checkbox-group label{
            text-transform:none;
            font-size:0.85rem;
            color:rgb(209, 188, 173); /* --text-muted */
            font-weight:normal;
            margin-bottom:0;
            cursor:pointer;
        }

        button{
            width:100%;
            padding:14px;
            background:rgb(84, 155, 255); /* --accent-blue */
            color:white;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-weight:bold;
            margin-top:1.2rem;
            font-size:1rem;
            transition:0.3s;
        }

        button:hover{
            background:rgb(59, 130, 246); /* Slightly darkened accent blue */
            transform:translateY(-2px);
        }

        button:disabled{
            background:rgb(110, 90, 76); /* --border-color */
            color:rgb(209, 188, 173); /* --text-muted */
            cursor:not-allowed;
            transform:none;
        }

        .utility-links{
            display:flex;
            justify-content:space-between;
            margin-top:12px;
            font-size:0.8rem;
        }

        .link-item{
            color:rgb(84, 155, 255); /* --accent-blue */
            cursor:pointer;
            text-decoration:underline;
            font-weight:500;
        }

        .toggle-text{
            margin-top:1.5rem;
            font-size:0.85rem;
            color:rgb(209, 188, 173); /* --text-muted */
            border-top:1px solid rgb(110, 90, 76); /* --border-color */
            padding-top:15px;
        }

        .toggle-text span{
            color:rgb(84, 155, 255); /* --accent-blue */
            cursor:pointer;
            font-weight:600;
            text-decoration:underline;
        }

        #error-msg{
            color:rgb(255, 93, 93); /* --accent-red */
            font-size:0.85rem;
            margin-top:10px;
            display:none;
            text-align:center;
        }

        #success-msg{
            color:rgb(41, 210, 154); /* --accent-emerald */
            font-size:0.85rem;
            margin-top:10px;
            display:none;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="box">

    <h2 id="title">
        Welcome Back
    </h2>

    <p id="subtitle">
        Enter your details to sign in
    </p>

    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="name@example.com"
        >

    </div>

    <div
        class="form-group"
        id="password-group"
    >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="••••••••"
        >

    </div>

    <div
        class="checkbox-group"
        id="age-group"
    >

        <input
            type="checkbox"
            id="ageCheck"
        >

        <label for="ageCheck">
            I confirm that I am
            15 years of age or older.
        </label>

    </div>

    <div
        class="utility-links"
        id="utility-area"
    >

        <div></div>

        <div
            class="link-item"
            onclick="switchViewState('forgot')"
        >
            Forgot Password?
        </div>

    </div>

    <button
        onclick="handleAuthAction()"
        id="mainBtn"
    >
        Sign In
    </button>

    <div id="error-msg"></div>

    <div id="success-msg"></div>

    <div
        class="toggle-text"
        id="toggleArea"
    >

        Don't have an account?

        <span
            onclick="switchViewState('signup')"
        >
            Sign Up
        </span>

    </div>

</div>

<script src="config.js"></script>

<script src="auth.js"></script>

<script>
    checkActiveSession(true);
</script>

</body>
</html>
